<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Produk - E-Katalog UMKM</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Script khusus form -->
    <script src="assets/js//form-pertemuan-4/form_handler.js"></script>
</head>
<body>
    <header class="admin-header">
        <h1>Dashboard Admin UMKM</h1>
        <nav class="admin-nav">
            <ul>
                <li><a href="dashboard.html">Data Produk (Tabel)</a></li>
                <li><a href="form.html" class="active">Tambah Produk (Form)</a></li>
                <li><a href="produkcard.html">Etalase UI (Card)</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="card form-section">
            <h2>Tambah Produk Elektronik Baru</h2>
            <form id="product-form">
                <div class="form-group">
                    <label for="product-name">Nama Produk:</label>
                    <input type="text" id="product-name" required placeholder="Contoh: Mouse Wireless">
                    <p id="preview-teks" class="live-preview"></p>
                </div>
                <div class="form-group">
                    <label for="product-category">Kategori:</label>
                    <select id="product-category" required>
                        <option value="">Pilih Kategori</option>
                        <option value="Laptop & PC">Laptop & PC</option>
                        <option value="Aksesoris Komputer">Aksesoris Komputer</option>
                        <option value="Audio & Video">Audio & Video</option>
                        <option value="Jaringan">Jaringan</option>
                    </select>
                    <p id="preview-kategori" class="live-preview"></p>
                </div>
                <div class="form-group">
                    <label for="product-price">Harga (Rp):</label>
                    <input type="number" id="product-price" required min="1000" placeholder="Contoh: 350000">
                </div>
                <div class="form-group">
                    <label for="stok">Stok:</label>
                    <input type="number" id="stok" required min="1" placeholder="Contoh: 10">
                </div>
                <button type="submit" class="btn btn-primary">Simpan ke Mock Data</button>
            </form>
            <div id="form-feedback" class="feedback-msg"></div>
        </section>
    </main>

    <footer class="admin-footer">
        <p>&copy; 2026 E-Katalog UMKM STIKOM Banyuwangi.</p>
    </footer>
</body>
</html>
